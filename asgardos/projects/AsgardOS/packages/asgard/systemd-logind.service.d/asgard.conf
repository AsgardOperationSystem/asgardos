# s2idle's brief wakeups advance CLOCK_MONOTONIC while userspace stays frozen; after a 7 h sleep (2026-10-16) that
# passed logind's 3 min watchdog and PID 1 killed it on resume. NetworkManager follows sleep through logind and left
# wlan0 "unavailable" (no DHCP) until restarted. A handheld's logind hanging is not worth that.
[Service]
WatchdogSec=0
