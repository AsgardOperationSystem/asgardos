# logind ignores lid events this long after boot/resume. 10 s, not 0: the lid reads "closed" for a moment at
# boot, and with 0 logind suspended 3.6 s in, killing the ADSP audio PD mid-init (no sound card). Not 30 (the
# default): a lid close soon after waking was ignored. A same-named file in /storage/.config/logind.conf.d wins.
[Login]
HoldoffTimeoutSec=10
