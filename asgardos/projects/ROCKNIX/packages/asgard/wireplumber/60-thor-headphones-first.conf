# Headphones outrank the speaker, so the default output follows the jack (ALSA ranks Speaker 1000, Headphones 728).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output._sys_devices_platform_sound_sound_card0.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.session = 1100, priority.driver = 1100 } }
  }
]
