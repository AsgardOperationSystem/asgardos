# Headphones report their battery over HFP (AT+IPHONEACCEV, AT+XEVENT, AT+BIEV), which PipeWire's native backend
# hands to BlueZ, where asgardos-bluetooth reads it (NET-1). Music stays on A2DP: an app opening a microphone
# doesn't switch the headphones to the call profile.
monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
