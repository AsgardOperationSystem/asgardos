# AUD-3: every output appears at Asgard's one volume, not a level of its own (asgard-one-volume.lua).
wireplumber.components = [
  {
    name = asgard-one-volume.lua, type = script/lua
    provides = asgard.one-volume
    requires = [ hooks.device.routes.state ]
  }
]
wireplumber.profiles = {
  main = {
    asgard.one-volume = required
  }
}
