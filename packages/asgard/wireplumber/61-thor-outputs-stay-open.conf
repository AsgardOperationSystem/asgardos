# SND-6: an idle output closes after 60 s, not WirePlumber's 5. Reopening the DSP's playback path takes about half a
# second, so a menu sound after a 5 s pause came late (Thor 2026-11-06: pw-play 190 ms with the output open, 725 ms
# after 7 s idle; the sound itself is ~130 ms). A game keeps its own stream open anyway, also through a sleep.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 60 } }
  }
]
