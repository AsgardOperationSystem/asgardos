; Nintendo layout like the Switch: A east, B south, X north, Y west. Handheld controller + handheld console mode
; ([System]), like a real Switch undocked: every game supports that pair (TWEWY Final Remix rejects a Pro Controller,
; and a docked console rejects Handheld). Eden's docked toggle switches player 1 to a Pro Controller itself.
