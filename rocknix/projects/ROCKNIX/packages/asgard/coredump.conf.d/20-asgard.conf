# Asgard: keep core dumps (ROCKNIX's 10-rocknix.conf drops them) so a crashed emulator can be debugged later:
# `coredumpctl list` / `coredumpctl debug`. Stored on /storage by asgard-cores.service; the oldest go past 10G.
[Coredump]
Storage=external
ProcessSizeMax=8G
ExternalSizeMax=8G
MaxUse=10G
KeepFree=20G
