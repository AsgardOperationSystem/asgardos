# Rotate the bottom panel (DSI-1) and add Thor's window rules. ROCKNIX regenerates the sway config every boot;
# the script appends after that.
[Service]
ExecStartPre=/usr/share/asgard/thor-sway-rotate.sh
# The boot animation lets go of the display first (waits until it has exited).
ExecStartPre=-/usr/bin/systemctl stop asgard-bootanim.service
# The splash on /dev/fb0 (static logo, update bar) turns the bottom panel's backlight off: back on.
ExecStartPre=-/bin/sh -c 'echo 0 > /sys/class/backlight/ae94000.dsi.0/bl_power'
